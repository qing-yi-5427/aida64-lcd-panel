<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="color-scheme" content="dark light"><title>曜屏 · 实时硬件面板</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="layout-editorial.css"><link rel="stylesheet" href="layout-ambient.css"><link rel="stylesheet" href="layout-telemetry.css"><link rel="stylesheet" href="layout-studio.css"><link rel="stylesheet" href="network.css"></head>
<body data-theme="classic"><main id="panel">
<div class="connection"><span id="status">等待电脑连接</span><span id="phone">PANELDECK</span></div>
<header><div class="eyebrow">曜屏 <span>DESK MONITOR</span></div><div class="time-row"><div id="clock" role="timer" aria-label="当前时间" aria-live="off">--:--<span>:--</span></div><div class="date"><b id="weekday">FRIDAY</b><div id="date">---- / -- / --</div></div></div></header>
<section class="power" aria-label="功耗"><div class="power-cell cpu"><label>CPU POWER</label><div class="reading"><strong data-key="cpuPower" data-decimals="1">—</strong><small>W</small></div></div><div class="power-cell gpu"><label>GPU POWER</label><div class="reading"><strong data-key="gpuPower" data-decimals="1">—</strong><small>W</small></div></div></section>
<section class="processors" aria-label="处理器与显卡">
<article class="processor cpu"><div class="processor-head"><b>CPU</b><span>PROCESSOR</span></div><div class="model" id="cpu-name">等待硬件数据</div><div class="util"><label>UTILIZATION</label><div class="util-row"><div class="reading"><strong data-key="cpuLoad">—</strong><small>%</small></div><div class="ring" id="cpu-ring" aria-hidden="true"></div></div></div><div class="stat"><label>TEMPERATURE</label><div class="reading"><strong data-key="cpuTemp">—</strong><small>°C</small></div></div><div class="stat"><label id="cpu-fan-label">FAN 1</label><div class="reading"><strong data-key="cpuFan">—</strong><small>RPM</small></div></div><div class="stat"><label>AVG CLOCK</label><div class="reading"><strong data-key="cpuClock">—</strong><small>MHz</small></div></div></article>
<article class="processor gpu"><div class="processor-head"><b>GPU</b><span>GRAPHICS</span></div><div class="model" id="gpu-name">等待硬件数据</div><div class="util"><label>UTILIZATION</label><div class="util-row"><div class="reading"><strong data-key="gpuLoad">—</strong><small>%</small></div><div class="ring" id="gpu-ring" aria-hidden="true"></div></div></div><div class="stat"><label>TEMPERATURE</label><div class="reading"><strong data-key="gpuTemp">—</strong><small>°C</small></div></div><div class="stat"><label>FAN 1</label><div class="reading"><strong data-key="gpuFan">—</strong><small>RPM</small></div></div><div class="stat"><label>CLOCK</label><div class="reading"><strong data-key="gpuClock">—</strong><small>MHz</small></div></div></article>
</section>
<section class="memory" aria-label="内存与显存"><div class="memory-cell cpu"><div class="memory-head"><label>RAM</label><b><span data-key="ramLoad">—</span>%</b></div><div class="used reading"><strong data-key="ramUsed" data-decimals="1">—</strong><small>GB</small></div><div class="track"><i id="ram-bar"></i></div></div><div class="memory-cell gpu"><div class="memory-head"><label>VRAM</label><b><span data-key="vramLoad">—</span>%</b></div><div class="used reading"><strong data-key="vramUsed" data-decimals="1">—</strong><small>GB</small></div><div class="track"><i id="vram-bar"></i></div></div></section>
<footer><div class="net-strip" aria-label="电脑物理网卡实时流量"><div class="net-cell"><span class="net-label">↓ 下载</span><div class="reading"><strong data-key="netDownload" data-format="rate" data-unit="download-unit">—</strong><small id="download-unit">B/s</small></div></div><div class="net-cell"><span class="net-label">↑ 上传</span><div class="reading"><strong data-key="netUpload" data-format="rate" data-unit="upload-unit">—</strong><small id="upload-unit">B/s</small></div></div></div><div class="footer-status"><span id="reason">本地面板 · 局域网连接</span><span id="freshness">等待数据</span></div></footer>
</main><script src="panel.js"></script></body></html>
